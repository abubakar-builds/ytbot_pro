<!-- Replace ONLY the <script> block at the bottom of public/index.html with this one. -->
<script>
    // Leave empty if the API is on the same domain.
    // If the API lives elsewhere (e.g. Render), set: 'https://your-api.onrender.com'
    const API_BASE = '';

    let currentUrl = '';

    const $ = (id) => document.getElementById(id);

    function toggleFaq(el) {
        const item = el.parentElement;
        const isActive = item.classList.contains('active');
        document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('active'));
        if (!isActive) item.classList.add('active');
    }

    async function readError(response, fallback) {
        try {
            const data = await response.json();
            return data.error || fallback;
        } catch (_) {
            if (response.status === 413) return 'File is too large for this server.';
            if (response.status === 504) return 'The server timed out. Try a lower quality.';
            return fallback;
        }
    }

    async function analyzeVideo() {
        const urlInput = $('url-input').value.trim();
        if (!urlInput) return alert('Please paste a valid YouTube URL');

        currentUrl = urlInput;
        const btn = $('analyze-btn');
        btn.disabled = true;
        btn.textContent = 'Analyzing...';

        $('app-ui').style.display = 'block';
        $('thumb').style.display = 'none';
        $('v-title').textContent = 'Fetching video info...';
        $('v-author').textContent = '';
        $('select-wrapper').style.display = 'none';
        $('download-btn').style.display = 'none';

        try {
            const response = await fetch(`${API_BASE}/api/info`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: currentUrl })
            });
            if (!response.ok) throw new Error(await readError(response, 'Could not load video.'));
            const data = await response.json();

            if (data.thumbnail) {
                $('thumb').src = data.thumbnail;
                $('thumb').style.display = 'block';
            }
            $('v-title').textContent = data.title || 'Untitled';
            $('v-author').textContent = data.uploader ? `By: ${data.uploader}` : '';

            const select = $('format-select');
            select.innerHTML = '';
            data.formats.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f.id;
                opt.textContent = f.label;
                select.appendChild(opt);
            });

            $('select-wrapper').style.display = 'block';
            $('download-btn').style.display = 'flex';
            $('download-btn').textContent = 'Start Download';
        } catch (error) {
            $('v-title').textContent = 'Error loading video';
            $('v-author').textContent = error.message;
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Download <span>→</span>';
        }
    }

    async function startDownload() {
        const quality = $('format-select').value;
        const btn = $('download-btn');
        btn.disabled = true;
        btn.textContent = 'Preparing file... please wait';

        try {
            const url = `${API_BASE}/api/download?url=${encodeURIComponent(currentUrl)}&quality=${encodeURIComponent(quality)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(await readError(response, 'Download failed.'));

            const disposition = response.headers.get('Content-Disposition') || '';
            const star = disposition.match(/filename\*=UTF-8''([^;]+)/i);
            const plain = disposition.match(/filename="?([^";]+)"?/i);
            const filename = star ? decodeURIComponent(star[1]) : (plain ? plain[1] : 'download');

            const blob = await response.blob();
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = blobUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        } catch (error) {
            $('v-author').textContent = error.message;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Start Download';
        }
    }
</script>
